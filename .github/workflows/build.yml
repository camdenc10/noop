name: Build Noop IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Locate project
        run: |
          PJ=$(find . -name project.yml | head -1)
          ROOT=$(cd "$(dirname "$PJ")" && pwd)
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          cd "$ROOT"
          if [ ! -d Noop ] && [ -d App ]; then
            mkdir Noop
            mv App Design Engine Model Services Views Noop/
          fi
          ls

      - name: Generate Xcode project
        working-directory: ${{ env.ROOT }}
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ${{ env.ROOT }}
        run: |
          xcodebuild -project Noop.xcodeproj -scheme Noop \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: ${{ env.ROOT }}
        run: |
          APP=build/Build/Products/Release-iphoneos/Noop.app
          ldid -SNoop.entitlements "$APP/Noop"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr "$GITHUB_WORKSPACE/Noop.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Noop-ipa
          path: Noop.ipa
