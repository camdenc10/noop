name: Build Noop IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Locate project
        run: |
          PJ=$(find . -name project.yml | head -1)
          ROOT=$(cd "$(dirname "$PJ")" && pwd)
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          cd "$ROOT"
          if [ ! -d Noop ] && [ -d App ]; then
            mkdir Noop
            mv App Design Engine Model Services Views Noop/
          fi
          ls

      - name: Make app icon
        working-directory: ${{ env.ROOT }}
        run: |
          python3 -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install -q pillow
          SET=Noop/Assets.xcassets
          mkdir -p "$SET/AppIcon.appiconset"
          cat > icon.py <<'PY'
          import sys
          from PIL import Image, ImageDraw
          S = 2048
          im = Image.new('RGB', (S, S), (0, 0, 0))
          d = ImageDraw.Draw(im)
          c = S / 2
          G = (255, 255, 255)
          sw = 190
          top, bot = c - 420, c + 420
          xs = [c - 560, c - 280, c, c + 280, c + 560]
          pts = [(xs[0], top), (xs[1], bot), (xs[2], top + 330), (xs[3], bot), (xs[4], top)]
          d.line(pts, fill=G, width=sw, joint='curve')
          for p in (pts[0], pts[-1], pts[1], pts[3], pts[2]):
              d.ellipse([p[0] - sw / 2, p[1] - sw / 2, p[0] + sw / 2, p[1] + sw / 2], fill=G)
          im.resize((1024, 1024), Image.LANCZOS).save(sys.argv[1])
          PY
          "$RUNNER_TEMP/v/bin/python" icon.py "$SET/AppIcon.appiconset/icon.png"
          echo '{"info":{"author":"xcode","version":1}}' > "$SET/Contents.json"
          echo '{"images":[{"filename":"icon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$SET/AppIcon.appiconset/Contents.json"
          "$RUNNER_TEMP/v/bin/python" - <<'PY'
          s = open("project.yml").read()
          s = s.replace("GENERATE_INFOPLIST_FILE: NO", "GENERATE_INFOPLIST_FILE: NO\n        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon")
          open("project.yml", "w").write(s)
          PY
          cat project.yml

      - name: Generate Xcode project
        working-directory: ${{ env.ROOT }}
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ${{ env.ROOT }}
        run: |
          xcodebuild -project Noop.xcodeproj -scheme Noop \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: ${{ env.ROOT }}
        run: |
          APP=build/Build/Products/Release-iphoneos/Noop.app
          ldid -SNoop.entitlements "$APP/Noop"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr "$GITHUB_WORKSPACE/Noop.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Noop-ipa
          path: Noop.ipa
