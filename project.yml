name: Noop
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Noop:
    type: application
    platform: iOS
    sources: [Noop]
    entitlements:
      path: Noop.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Noop
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSBluetoothAlwaysUsageDescription: Noop connects to your Bluetooth heart rate sensor to show its battery level and live heart rate.
        NSHealthShareUsageDescription: Noop reads your heart rate, HRV, sleep, steps and workouts from Apple Health to calculate recovery, strain and sleep scores on this phone. Nothing leaves your device.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Noop
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
